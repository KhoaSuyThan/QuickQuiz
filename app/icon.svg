<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Gradient nhận diện thương hiệu QuickQuiz: Blue to Indigo -->
    <linearGradient id="quickquiz-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <!-- Nền squircle bo tròn hiện đại -->
  <rect width="32" height="32" rx="7" fill="url(#quickquiz-grad)" />
  <!-- Biểu tượng tia sét Zap màu trắng -->
  <polygon points="17,5 8,16 15,16 14,26 24,14 17,14 18,5" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
